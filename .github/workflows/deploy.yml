name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker compose build

      - name: Deploy
        run: docker compose up -d

      - name: Prune dangling images
        run: docker image prune -f